name: Wedding photos and website
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
concurrency:
  group: wedding-website
  cancel-in-progress: false
jobs:
  publish:
    runs-on: macos-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/photo-requirements.txt
      - name: Install photo tools
        run: |
          python -m pip install -r scripts/photo-requirements.txt
          swiftc scripts/upright.swift -o "$RUNNER_TEMP/upright"
      - name: Sync new wedding photos
        if: github.event_name != 'push' && vars.PHOTO_INITIAL_IMPORT != 'true'
        run: python scripts/sync-wedding-photos.py --workers 6 --upright "$RUNNER_TEMP/upright"
      - name: Check site and guest uploads
        run: |
          node check.js
          node photos/test-dng-preview.cjs
          node apps-script/photos/test-backend.cjs
          node apps-script/photos/test-interactions.cjs
      - name: Save new JPEGs
        if: github.event_name != 'push' && vars.PHOTO_INITIAL_IMPORT != 'true'
        run: |
          git config user.name 'Wedding photo sync'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add photos/wedding photos/featured*.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Sync wedding photos from Drive'
            git pull --rebase origin main
            git push origin main
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare website
        run: |
          mkdir "$RUNNER_TEMP/site"
          rsync -a --exclude='.git' --exclude='.github' --exclude='scripts' --exclude='apps-script' --exclude='__pycache__' --exclude='processing-report.json' ./ "$RUNNER_TEMP/site/"
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/site
      - name: Wait for the Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for attempt in {1..15}; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq "[.artifacts[] | select(.name == \"$ARTIFACT_NAME\")] | length" 2>/dev/null) || count=0
            if [[ "$count" == 1 ]]; then sleep 10; exit 0; fi
            sleep 3
          done
          echo 'Pages artifact is not visible yet. Retry this deployment.'
          exit 1
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
